[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-metrics-plugin"
version = "1.0.0"
description = "Compact pytest session context and timing reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]

[project.entry-points.pytest11]
context_metrics = "context_metrics.plugin"

[tool.setuptools.packages.find]
include = ["context_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
